<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>অ্যাকাউন্ট — জেএসটি বিডি ক্রোকারিজ</title>
  <meta name="description" content="জেএসটি বিডি ক্রোকারিজে অ্যাকাউন্ট তৈরি করুন অথবা লগইন করুন।">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <meta name="theme-color" content="#047857">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container">
    <div class="account-wrap">
      <!-- লগইন / রেজিস্টার -->
      <div class="account-card" id="account-guest" style="display:none">
        <h1>👤 স্বাগতম!</h1>
        <p>দ্রুত অর্ডার করতে অ্যাকাউন্ট তৈরি করুন অথবা লগইন করুন</p>
        <div class="acc-tabs">
          <button id="tab-login" class="active">🔑 লগইন</button>
          <button id="tab-register">📝 অ্যাকাউন্ট তৈরি করুন</button>
        </div>

        <form id="form-login">
          <div class="form-group">
            <label for="login-phone">মোবাইল নম্বর <i>*</i></label>
            <input type="tel" id="login-phone" inputmode="numeric" placeholder="01XXXXXXXXX" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="login-pass">পাসওয়ার্ড <i>*</i></label>
            <input type="password" id="login-pass" placeholder="আপনার পাসওয়ার্ড" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">🔑 লগইন করুন</button>
        </form>

        <form id="form-register" style="display:none">
          <div class="form-group">
            <label for="reg-name">আপনার নাম <i>*</i></label>
            <input type="text" id="reg-name" placeholder="যেমন: রহিম উদ্দিন" autocomplete="name">
          </div>
          <div class="form-group">
            <label for="reg-phone">মোবাইল নম্বর <i>*</i></label>
            <input type="tel" id="reg-phone" inputmode="numeric" placeholder="01XXXXXXXXX" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="reg-address">ঠিকানা (ঐচ্ছিক)</label>
            <input type="text" id="reg-address" placeholder="আপনার এলাকা / ঠিকানা">
          </div>
          <div class="form-group">
            <label for="reg-pass">পাসওয়ার্ড দিন <i>*</i></label>
            <input type="password" id="reg-pass" placeholder="কমপক্ষে ৪ অক্ষর" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="reg-pass2">পাসওয়ার্ড আবার দিন <i>*</i></label>
            <input type="password" id="reg-pass2" placeholder="একই পাসওয়ার্ড আবার লিখুন" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">📝 অ্যাকাউন্ট তৈরি করুন</button>
        </form>
      </div>

      <!-- লগইন করা ইউজার -->
      <div class="account-card acc-user" id="account-user" style="display:none">
        <div class="acc-avatar" id="acc-avatar">👤</div>
        <h2 id="acc-name"></h2>
        <div class="acc-row">📞 <b id="acc-phone"></b></div>
        <div class="acc-row">📍 <span id="acc-address"></span></div>
        <div class="acc-actions">
          <a class="btn btn-primary" href="products.html">🛍️ কেনাকাটা করুন</a>
          <a class="btn btn-outline" href="cart.html">🛒 কার্ট</a>
        </div>
        <div class="acc-actions">
          <button class="btn btn-outline" id="logout-btn" style="border-color:#dc2626;color:#dc2626">🚪 লগআউট</button>
        </div>
        <p class="acc-note">✅ আপনার তথ্য সংরক্ষিত আছে — অর্ডারের সময় স্বয়ংক্রিয়ভাবে বসে যাবে।</p>
      </div>
    </div>
  </main>

  <script src="assets/js/store.js"></script>
  <script>initAccount();</script>
</body>
</html>
