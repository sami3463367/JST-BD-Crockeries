<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>সব পণ্য — জেএসটি বিডি ক্রোকারিজ</title>
  <meta name="description" content="জেএসটি বিডি ক্রোকারিজের সব পণ্য — মিক্সার গ্রাইন্ডার, কুকওয়্যার সেট, কিচেন ইলেকট্রনিক্স।">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <meta name="theme-color" content="#047857">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container">
    <div class="page-title">
      <h1>🛍️ সব পণ্য</h1>
      <p id="products-count"></p>
    </div>

    <div class="filter-bar">
      <div class="pills" id="cat-pills"></div>
      <div class="filter-row">
        <label class="sort-wrap">সাজান:
          <select id="sort-select">
            <option value="new">নতুন আগে</option>
            <option value="price-asc">দাম: কম → বেশি</option>
            <option value="price-desc">দাম: বেশি → কম</option>
            <option value="rating">সেরা রেটিং</option>
            <option value="discount">সর্বোচ্চ ছাড়</option>
          </select>
        </label>
        <label class="stock-check"><input type="checkbox" id="stock-only"> স্টকে আছে</label>
      </div>
    </div>

    <div class="search-note" id="search-note">
      <span></span>
      <a href="products.html">✖ মুছুন</a>
    </div>

    <div class="p-grid" id="products-grid" style="padding-bottom:10px"></div>

    <div class="empty-box" id="products-empty" style="display:none">
      <div class="e-ico">🔍</div>
      <h2>কোনো পণ্য পাওয়া যায়নি</h2>
      <p>অন্য নামে খুঁজে দেখুন অথবা সব পণ্য ব্রাউজ করুন।</p>
      <a class="btn btn-primary" href="products.html">সব পণ্য দেখুন</a>
    </div>
  </main>

  <script src="assets/js/store.js"></script>
  <script>initProducts();</script>
</body>
</html>
